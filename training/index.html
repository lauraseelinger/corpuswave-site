<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Spyglasses steps</title>
<style>
/* One page of how-to steps: green sidebar (task + jump links) beside numbered sections. Neutral, unbranded. */
:root {
  --bg: #f6f7f8; --surface: #ffffff; --surface-2: #eef0f3; --ink: #1f2328; --muted: #5d646d; --line: #dde1e6;
  --accent: #2f5fa7; --accent-ink: #ffffff; --accent-soft: #edf3fa; --accent-line: #9fb6d3;
  --ok: #2b7a4b; --warn: #8a5a00; --warn-soft: #fbf1db; --mark: #e8590c;
  --rail-bg: #e1efe7; --rail-line: #bcd8c7;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181b; --surface: #1e2125; --surface-2: #272b30; --ink: #e8eaed; --muted: #a2a9b2; --line: #343a41;
    --accent: #82a9e6; --accent-ink: #16181b; --accent-soft: #1c2938; --accent-line: #4d6a8f;
    --ok: #6fcf97; --warn: #e8b45a; --warn-soft: #33281a; --rail-bg: #16261d; --rail-line: #2b4637; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16181b; --surface: #1e2125; --surface-2: #272b30; --ink: #e8eaed; --muted: #a2a9b2; --line: #343a41;
  --accent: #82a9e6; --accent-ink: #16181b; --accent-soft: #1c2938; --accent-line: #4d6a8f;
  --ok: #6fcf97; --warn: #e8b45a; --warn-soft: #33281a; --rail-bg: #16261d; --rail-line: #2b4637; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); }
h1, h2 { margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; }
.topbar-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; margin-right: auto; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.rail { position: sticky; top: 72px; background: var(--rail-bg); border: 1px solid var(--rail-line); border-radius: 14px; padding: 16px; }
@media (max-width: 860px) { .rail { position: static; } }
.rail .task { font-weight: 700; font-size: 16px; line-height: 1.35; }
.rail .prop { color: var(--muted); font-size: 13px; margin-top: 2px; }
.rail nav { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
.rail nav a { display: flex; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px; }
.rail nav a:hover { background: var(--surface); }
.rail nav .n { color: var(--muted); font-weight: 600; min-width: 1.2em; }

.main { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px clamp(16px, 3vw, 32px); min-width: 0; }
.card h1 { font-size: clamp(24px, 3vw, 30px); }
.card h2 { font-size: 21px; display: flex; gap: 12px; align-items: baseline; }
.card h2 .n { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 15px; flex: none; }
.lede { color: var(--muted); margin: 6px 0 0; }
.card p, .card li { max-width: 72ch; }
.card ol, .card ul { padding-left: 22px; margin: 12px 0; }
.card li { margin-bottom: 8px; }
.stop { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); border: 1px solid var(--warn); font-size: 14px; max-width: 72ch; }

.shot { margin: 14px 0 4px; max-width: 860px; }
.shot img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.shot figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }

.label { font-weight: 700; margin: 18px 0 6px; }
.paste { width: 100%; min-height: 200px; font: 12.5px/1.5 var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre; overflow: auto; tab-size: 24; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 8px; font-size: 14px; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.note { font-size: 13px; color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.tick { width: 1%; text-align: center; }
td.tick input { width: 17px; height: 17px; accent-color: var(--accent); }
tr.ticked td:not(.tick) { color: var(--muted); }
.tag { display: inline-block; font-size: 12px; padding: 0 8px; margin: 0 4px 2px 0; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }

.field { margin-top: 14px; max-width: 560px; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
input[type="text"], input[type="password"], textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
textarea { min-height: 70px; resize: vertical; }
input:focus, textarea:focus { border-color: var(--accent); outline: none; }
.lock { max-width: 520px; }
.lock input { max-width: 360px; }
.err { color: var(--warn); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<!-- Unbranded Spyglasses how-to: ?a=<pack id> loads packs/<id>.enc.json (AES-GCM, PBKDF2-SHA256); #k=<password> unlocks. Generated by build.py from sop.html; edit there. -->
<header class="topbar"><div class="topbar-inner"><span class="brand">Spyglasses steps</span><span class="chip" id="chip">Loading…</span></div></header>
<main class="wrap" id="app"><div class="card"><h1>Loading…</h1></div></main>

<script>
(() => {
"use strict";

const TRAINER = "Laura";
const PACK_ID = (new URLSearchParams(location.search).get("a") || "").replace(/[^a-z0-9-]/gi, "");
const STORE_KEY = "spyglasses-steps-" + PACK_ID;
const KEY_STORE = "spyglasses-steps-key-" + PACK_ID;

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { pack: null, notes: { name: "", preview: "", projects: "", issues: "", rows: [] }, storageOk: true };

/* ---------- Saved notes (this browser only) ---------- */
function loadNotes() { try { const v = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (v) S.notes = { ...S.notes, ...v }; } catch { S.storageOk = false; } }
function saveNotes() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S.notes)); S.storageOk = true; } catch { S.storageOk = false; } chip(); }
function chip() { $("chip").textContent = S.storageOk ? "Your ticks and notes save in this browser" : "This browser isn't saving. Copy your notes before closing."; }

/* ---------- Page ---------- */
const shots = key => ((S.pack.visuals || {})[key] || []).map(v =>
  `<figure class="shot"><img src="${esc(v.src)}" alt="${esc(v.caption || "")}" loading="lazy"><figcaption>${esc(v.caption || "")}</figcaption></figure>`).join("");

function render() {
  const p = S.pack; const prompts = p.prompts || []; const projects = p.projects || [];
  const n = prompts.length; const before = projects[0] ? projects[0].before : "";
  // Spyglasses' Paste import reads spreadsheet cells: tab-separated columns under a header row.
  const paste = ["Prompt\tType\tTag 1\tTag 2"].concat(prompts.map(r => [r.text, r.type, ...(r.tags || [])].join("\t"))).join("\n");
  const rows = S.notes.rows || [];
  // A pack with no projects (Laura builds them herself) skips the projects step.
  const sections = [["start", "Before you start"], ["import", "Import the prompts"], ["check", "Check types and tags"], ["projects", "Add them to the projects"], ["send", `Send ${TRAINER} your notes`]]
    .filter(([id]) => id !== "projects" || projects.length);

  $("app").innerHTML = `<div class="layout">
<aside class="rail"><div class="task">${esc(p.title)}</div><div class="prop">Property: ${esc(p.property || "")}</div>
<nav aria-label="Steps">${sections.map(([id, t], i) => `<a href="#${id}"><span class="n">${i || ""}</span>${esc(t)}</a>`).join("")}</nav></aside>
<div class="main">

<section class="card" id="start"><h1>${esc(p.title)}</h1><p class="lede">Follow these in order. It's all in Spyglasses, in the ${esc(p.property || "")} property.</p>
<ul>
<li>Check the property switcher in the top left of Spyglasses. It must say <strong>${esc(p.propertyName || p.property || "")}</strong>.</li>
${(p.notes || []).map(t => `<li>${esc(t)}</li>`).join("")}
</ul>${shots("switcher")}</section>

<section class="card" id="import"><h2><span class="n">1</span>Import the prompts</h2>
<ol>
<li>In the left menu under Manage, click <strong>Prompts</strong>, then <strong>Import</strong>.</li>
<li>Stay on the <strong>Paste</strong> tab. Click <strong>Copy the list</strong> below, paste it into the box and click <strong>Preview prompts</strong>.</li>
<li>Check that the preview says <strong>${n} prompts ready to import</strong> and every row has a type and two tags. Then import.</li>
</ol>
${(p.newTags || []).length ? `<p>The preview will say it's creating ${p.newTags.length === 1 ? "a new tag" : "new tags"}: ${p.newTags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}. That's expected.</p>` : ""}
<div class="stop">Stop and send ${TRAINER} a note if the count isn't ${n}, a column is blank, or Spyglasses says a prompt is very similar to one already there.</div>
${shots("import")}
<div class="label">The list to paste (${n} prompts with their types and tags)</div>
<textarea class="paste" id="pasteText" readonly>${esc(paste)}</textarea>
<div class="row"><button class="btn" type="button" id="copyPaste">Copy the list</button><span class="note" id="copyPasteNote"></span></div>
</section>

<section class="card" id="check"><h2><span class="n">2</span>Check each prompt's type and tags</h2>
<ol>
<li>On the Prompts page, find each prompt from the sheet below with the search box.</li>
<li>Its type shows under the prompt text. Its tags are in the Tags column. Both should match the sheet.</li>
<li>To fix one, click <strong>⋯</strong> at the end of its row, then <strong>Edit</strong>. Change the Prompt Type or the tags and click <strong>Update Prompt</strong>. Leave Location and Context blank.</li>
</ol>
${shots("check")}
<div class="label">The sheet <span class="note" id="rowCount">${rows.filter(Boolean).length} of ${n} checked</span></div>
<div class="table-wrap"><table><thead><tr><th>#</th><th>Prompt</th><th>Type</th><th>Tags</th><th>Checked</th></tr></thead><tbody>
${prompts.map((r, i) => `<tr class="${rows[i] ? "ticked" : ""}"><td class="n">${i + 1}</td><td>${esc(r.text)}</td><td>${esc(r.type)}</td><td>${(r.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</td><td class="tick"><input type="checkbox" data-row="${i}" aria-label="Checked prompt ${i + 1}" ${rows[i] ? "checked" : ""}></td></tr>`).join("")}
</tbody></table></div>
</section>

${projects.length ? `<section class="card" id="projects"><h2><span class="n">3</span>Add the new prompts to ${projects.length === 1 ? "the project" : "both projects"}</h2>
<ol>
<li>Click <strong>Projects</strong> in the left menu and open <strong>${esc(projects[0] ? projects[0].name : "")}</strong>.</li>
<li>Go to its <strong>Prompts</strong> tab and click <strong>Add prompts</strong>.</li>
<li>Select the ${n} new prompts and add them. Spyglasses warns that this changes the project's numbers from today on, which is expected.</li>
${projects.slice(1).map(pr => `<li>Do the same for <strong>${esc(pr.name)}</strong>.</li>`).join("")}
</ol>
<p>Don't remove any prompt that's already in a project. When you're done, each project should show <strong>${esc(projects.map(pr => pr.after).filter((v, i, a) => a.indexOf(v) === i).join(" / "))} prompts</strong>${before !== "" ? ` (it shows ${esc(before)} now)` : ""}.</p>
${shots("projects")}
</section>` : ""}

<section class="card" id="send"><h2><span class="n">${projects.length ? 4 : 3}</span>Send ${TRAINER} your notes</h2>
<p>Fill these in, then copy your notes and paste them into a message to ${TRAINER}.</p>
<div class="field"><label for="f-name">Your name</label><input type="text" id="f-name" value="${esc(S.notes.name)}" autocomplete="name"></div>
<div class="field"><label for="f-preview">Preview count before you imported</label><input type="text" id="f-preview" value="${esc(S.notes.preview)}" placeholder="${n}"></div>
${projects.length ? `<div class="field"><label for="f-projects">Prompts in each project now</label><input type="text" id="f-projects" value="${esc(S.notes.projects)}" placeholder="${esc(projects.map(pr => pr.name + ": " + pr.after).join(", "))}"></div>` : ""}
<div class="field"><label for="f-issues">Anything that looked off (or “nothing”)</label><textarea id="f-issues">${esc(S.notes.issues)}</textarea></div>
<div class="row"><button class="btn" type="button" id="copyNotes">Copy my notes</button><button class="btn ghost" type="button" id="downloadNotes">Download them</button><span class="note" id="notesNote"></span></div>
</section>
</div></div>`;

  document.querySelectorAll("[data-row]").forEach(cb => cb.addEventListener("change", () => {
    const r = (S.notes.rows || []).slice(); r[Number(cb.dataset.row)] = cb.checked; S.notes.rows = r; saveNotes();
    cb.closest("tr").classList.toggle("ticked", cb.checked);
    $("rowCount").textContent = `${r.filter(Boolean).length} of ${n} checked`;
  }));
  [["f-name", "name"], ["f-preview", "preview"], ["f-projects", "projects"], ["f-issues", "issues"]].forEach(([id, key]) =>
    $(id) && $(id).addEventListener("input", e => { S.notes[key] = e.target.value; saveNotes(); }));
  $("copyPaste").addEventListener("click", () => copyText($("pasteText").value, $("copyPasteNote"), $("pasteText")));
  $("copyNotes").addEventListener("click", () => copyText(buildNotes(), $("notesNote")));
  $("downloadNotes").addEventListener("click", downloadNotes);
  chip();
}

/* ---------- Notes for Laura ---------- */
// Readable summary first, then one data line Laura can paste back to Claude to check against Spyglasses.
function buildNotes() {
  const p = S.pack; const prompts = p.prompts || []; const rows = S.notes.rows || [];
  const left = prompts.map((r, i) => rows[i] ? null : `#${i + 1} ${r.text}`).filter(Boolean);
  const L = [`Spyglasses steps: ${p.title}`, `Property: ${p.property || ""}`, `From: ${S.notes.name || "(no name)"}`, `Sent: ${new Date().toLocaleString()}`, ``,
    `Preview count: ${S.notes.preview || "(blank)"}`, ...((p.projects || []).length ? [`Prompts in each project now: ${S.notes.projects || "(blank)"}`] : []),
    `Sheet checked: ${prompts.length - left.length} of ${prompts.length}${left.length ? ". Not checked: " + left.join(" | ") : ""}`,
    `Anything off: ${S.notes.issues || "(blank)"}`, ``, `---- data for ${TRAINER} (leave as is) ----`,
    JSON.stringify({ assignment: PACK_ID, packVersion: p.updatedAt || null, sentAt: new Date().toISOString(), ...S.notes })];
  return L.join("\n");
}
function copyText(text, note, selectEl) {
  const fallback = () => {
    if (selectEl) { selectEl.focus(); selectEl.select(); note.textContent = "Selected. Press Ctrl+C or Cmd+C to copy."; return; }
    const ta = document.createElement("textarea"); ta.value = text; ta.style.minHeight = "160px"; note.replaceWith(ta); ta.select();
  };
  try { navigator.clipboard.writeText(text).then(() => { note.textContent = "Copied."; }, fallback); } catch { fallback(); }
}
function downloadNotes() {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([buildNotes()], { type: "text/plain" }));
  a.download = `spyglasses-notes-${PACK_ID}-${new Date().toISOString().slice(0, 10)}.txt`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Password ---------- */
// The pack is published only as AES-GCM ciphertext (key from PBKDF2-SHA256); the password decrypts it here in the browser.
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptPack(enc, pw) {
  try {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct))));
  } catch { return null; }
}
function start(pack, pw) {
  try { localStorage.setItem(KEY_STORE, pw); } catch {}
  S.pack = pack; document.title = pack.title || document.title;
  loadNotes(); render();
}
function message(title, text) { $("chip").textContent = "Not loaded"; $("app").innerHTML = `<div class="card lock"><h1>${esc(title)}</h1><p>${esc(text)}</p></div>`; }
function showLock(enc) {
  $("chip").textContent = "Locked";
  $("app").innerHTML = `<form class="card lock" id="lockForm"><h1>Enter your password</h1><p>${TRAINER} sent you a password with this link. You only need to enter it once on this computer.</p>
<div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" autofocus></div>
<div class="row"><button class="btn" type="submit" id="unlockBtn">Open the steps</button><span class="err" id="lockErr" role="alert"></span></div></form>`;
  $("lockForm").addEventListener("submit", async e => {
    e.preventDefault(); const pw = $("pw").value.trim(); if (!pw) return;
    $("unlockBtn").disabled = true; $("lockErr").textContent = "Checking…";
    const pack = await decryptPack(enc, pw); if (pack) return start(pack, pw);
    $("unlockBtn").disabled = false; $("lockErr").textContent = `That password didn't work. Check it against ${TRAINER}'s message and try again.`;
  });
}
async function boot() {
  if (!PACK_ID) return message("This link is missing its task", `Use the full link ${TRAINER} sent you. It ends with ?a= and the task name.`);
  if (!window.crypto || !crypto.subtle) return message("This page needs a secure connection", "Open it from the https:// link, not a saved copy.");
  let enc;
  try { const res = await fetch(`packs/${PACK_ID}.enc.json`, { cache: "no-store" }); if (!res.ok) throw 0; enc = await res.json(); }
  catch { return message("This page couldn't load", `Check your connection and reload. If it still doesn't load, send ${TRAINER} the link you used.`); }
  // A password in the link (#k=...) never reaches the server; drop it from the address bar once read.
  const fromLink = new URLSearchParams(location.hash.slice(1)).get("k");
  if (fromLink) history.replaceState(null, "", location.pathname + location.search);
  let saved = null; try { saved = localStorage.getItem(KEY_STORE); } catch {}
  for (const pw of [fromLink, saved]) { if (!pw) continue; const pack = await decryptPack(enc, pw); if (pack) return start(pack, pw); }
  showLock(enc);
}
boot();
})();
</script>
</body>
</html>
